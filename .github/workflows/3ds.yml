name: Nintendo 3DS

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'platform/3ds/**'
      - 'tests/3ds/**'
      - '.github/workflows/3ds.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'platform/3ds/**'
      - 'tests/3ds/**'
      - '.github/workflows/3ds.yml'

concurrency:
  group: 3ds-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Input, framebuffer and SD staging tests
        run: python3 platform/3ds/tools/check_host.py

  native-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake toolchain and audio dependencies
        run: dkp-pacman -S --needed --noconfirm 3ds-cmake devkitarm-cmake 3ds-pkg-config 3ds-zlib 3ds-libvorbisidec
      - name: Configure native game
        run: >-
          cmake -S platform/3ds -B build/3ds
          -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake"
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and package 3DSX
        run: cmake --build build/3ds -j2
      - uses: actions/upload-artifact@v4
        with:
          name: Hero3DS-experimental
          path: |
            build/3ds/Hero3DS.3dsx
            build/3ds/Hero3DS.smdh
          if-no-files-found: error
